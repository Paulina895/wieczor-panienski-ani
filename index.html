<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wieczór Panieński Ani 💗</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff0f6;
  color: #555;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: 40px auto;
  background: white;
  padding: 30px;
  border-radius: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
  color: #d63384;
  font-size: 38px;
}

h2 {
  color: #d63384;
}

button {
  background: #d63384;
  color: white;
  border: none;
  padding: 14px 25px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
}

input {
  margin: 15px;
}
</style>

</head>

<body>

<div class="container">

<h1>Wieczór Panieński Ani 💗</h1>

<p>
Razem tworzymy piękne wspomnienia 🌸
</p>

<h2>📸 Dodaj zdjęcia i filmiki</h2>

<input 
type="file" 
id="fileInput"
accept="image/*,video/*"
multiple
>

<br>

<button onclick="uploadFiles()">
💗 Dodaj do albumu
</button>

<p id="status"></p>
  <h2>💕 Wspomnienia z wieczoru Ani 💕</h2>

<div id="gallery" style="
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
">
</div>

</div>


<script>

const supabaseClient = supabase.createClient(
  "https://vhamqmqomwfmbetsgunr.supabase.co",
  "sb_publishable_hp8Rd_IpzsqfFLfZbndayg_obgR8Bgu"
);


async function uploadFiles() {

const files = document.getElementById("fileInput").files;
const status = document.getElementById("status");


if (!files.length) {
status.innerHTML = "Najpierw wybierz zdjęcia 💕";
return;
}


status.innerHTML = "Wysyłam zdjęcia... 🌸";


for (const file of files) {


const fileName = Date.now() + "-" + file.name;


const { error } = await supabaseClient
.storage
.from("zdjecia-ani")
.upload(fileName, file);


if (error) {

console.log(error);

status.innerHTML = "Coś poszło nie tak 😢";

return;

}

}


status.innerHTML = "Gotowe! Zdjęcia Ani są zapisane 💗";


}
async function loadGallery() {
  
console.log("Galeria startuje");
  
const gallery = document.getElementById("gallery");

const { data, error } = await supabaseClient
.storage
.from("zdjecia-ani")
.list();
  
console.log("Pliki z Supabase:", data);
console.log("Błąd:", error);


if (error) {
console.log(error);
return;
}


gallery.innerHTML = "";


data.forEach(file => {

const url = supabaseClient
.storage
.from("zdjecia-ani")
.getPublicUrl(file.name).data.publicUrl;


gallery.innerHTML += `
<div>

<img 
src="${url}" 
style="
width:100%;
border-radius:20px;
box-shadow:0 3px 10px #ddd;
"
/>

<br>

<a href="${url}" download>
<button style="margin-top:10px;">
⬇️ Pobierz zdjęcie
</button>
</a>

</div>
`;

});


}


loadGallery();
</script>


</body>
</html>
