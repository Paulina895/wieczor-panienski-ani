<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wieczór Panieński Ani 💕</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #ffe6ef, #fff7fa);
      color: #7a3b52;
      text-align: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px 25px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(180, 90, 120, 0.15);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
      color: #d85d8b;
    }

    .heart {
      font-size: 45px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      margin-top: 25px;
      background: #e88aaa;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #d85d8b;
    }

    .gallery {
      margin-top: 40px;
      padding: 20px;
      border-radius: 20px;
      background: #fff0f5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="heart">💕</div>

  <h1>Wieczór Panieński Ani</h1>

  <p>
    Zostaw tutaj swoje zdjęcia i filmiki,
    żebyśmy mogły zachować wszystkie piękne chwile ✨
  </p>

  <button>
    📸 Dodaj zdjęcia
  </button>

  <div class="gallery">
    <h2>Nasze wspomnienia 🌸</h2>
    <p>
      Galeria pojawi się tutaj już niedługo 💗
    </p>
  </div>

</div>
<!-- ALBUM ANI -->
<div style="margin-top:40px; text-align:center; background:#fff0f6; padding:25px; border-radius:20px;">
  <h2 style="color:#d63384;">📸 Dodaj zdjęcia i filmiki</h2>
  <p style="color:#777;">Podziel się wspomnieniami z wieczoru Ani 💕</p>

  <input 
    type="file" 
    id="fileInput" 
    accept="image/*,video/*" 
    multiple
  >

  <br><br>

  <button 
    onclick="uploadFiles()"
    style="
      background:#d63384;
      color:white;
      border:none;
      padding:12px 25px;
      border-radius:25px;
      font-size:16px;
      cursor:pointer;
    "
  >
    💗 Dodaj do albumu
  </button>

  <p id="status"></p>
</div>

<script>
async function uploadFiles() {
  const files = document.getElementById('fileInput').files;
  const status = document.getElementById('status');

  if (!files.length) {
    status.innerHTML = "Wybierz najpierw zdjęcia 💕";
    return;
  }

  status.innerHTML = "Dodaję zdjęcia... 🌸";

  for (const file of files) {
    const fileName = Date.now() + "-" + file.name;

    const response = await fetch(
      "TU_BEDZIE_POLACZENIE_Z_SUPABASE",
      {
        method: "POST",
        body: file
      }
    );
  }

  status.innerHTML = "Gotowe! 🎉";
}
</script>
</body>
</html>
